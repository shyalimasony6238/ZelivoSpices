<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maintenance | Zelivo Spices</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f8f6ef;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .maintenance-box {
            background: white;
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 50px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .icon {
            font-size: 65px;
            color: #b8860b;
            margin-bottom: 20px;
        }

        .brand {
            font-size: 30px;
            font-weight: bold;
            color: #355e3b;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 38px;
            color: #333;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.7;
        }

        .message {
            margin-top: 25px;
            padding: 12px 20px;
            background: #f5f1df;
            border-radius: 8px;
            color: #6b5610;
            font-size: 14px;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #999;
        }

        @media (max-width: 576px) {
            .maintenance-box {
                padding: 40px 20px;
            }

            h1 {
                font-size: 30px;
            }

            .brand {
                font-size: 25px;
            }

            .icon {
                font-size: 55px;
            }
        }
    </style>
</head>

<body>

    <div class="maintenance-box">

        <div class="icon">
            <i class="fas fa-tools"></i>
        </div>

        <div class="brand">
            ZELIVO SPICES
        </div>

        <h1>We'll Be Back Soon!</h1>

        <p>
            Our website is currently undergoing some maintenance.
            We are working to improve your experience.
        </p>

        <div class="message">
            <i class="fas fa-clock"></i>
            &nbsp; Please check back shortly.
        </div>

        <div class="footer">
            Thank you for your patience and support.
            <br><br>
            © 2026 Zelivo Spices. All Rights Reserved.
        </div>

    </div>

</body>
</html>
