<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Zelivo Spices</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3eb;
        }

        .register-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            display: block;
            width: 90px;
            height: 90px;
            object-fit: cover;
            margin: 0 auto 15px;
            border-radius: 50%;
        }

        .register-card h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 30px;
        }

        .register-card .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #f8d7da;
            color: #842029;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 18px;
            flex: 1;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #7b4a20;
        }

        .register-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 8px;
            background: #7b4a20;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .register-btn:hover {
            opacity: 0.9;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .login-link a {
            color: #7b4a20;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
        }

        @media (max-width: 600px) {

            .register-card {
                padding: 25px 20px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .register-card h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="register-page">

    <div class="register-card">

        <img
            src="{% static 'images/logo.jpg' %}"
            alt="Zelivo Spices"
            class="logo"
        >

        <h1>Create Account</h1>

        <p class="subtitle">
            Join Zelivo Spices and start shopping
        </p>


        {% if messages %}
            <div class="messages">

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>
        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-row">

                <div class="form-group">

                    <label for="first_name">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        placeholder="Enter first name"
                        value="{{ request.POST.first_name }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="last_name">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                        placeholder="Enter last name"
                        value="{{ request.POST.last_name }}"
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    value="{{ request.POST.username }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    value="{{ request.POST.email }}"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password_confirm">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="password_confirm"
                        name="password_confirm"
                        placeholder="Confirm password"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>

        </form>


        <p class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">
                Login
            </a>
        </p>


        <a
            href="{% url 'home' %}"
            class="back-home"
        >
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
